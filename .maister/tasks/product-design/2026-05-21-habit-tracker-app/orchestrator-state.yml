  project_context_summary: "Self-hosted personal productivity platform on Raspberry Pi. Nx monorepo with React/Vue/Angular apps. FastAPI backend with Vikunja, Actual Budget, brain notes integrations. Single-user. Cookie-based auth. Docker deployment via GitHub Actions."
  phase_summaries:
    context_synthesis:
      summary: "Habit tracker app for cockpit-app Nx monorepo. React 19 + Vite 6 + Tailwind v4 + shadcn/ui. Multi-user (existing users table). 3 habit types: boolean/numeric/text-diary, each with distinct check-in UX and graph type. Daylio-style icon grid, no mood tracking. Preset library. UX research: speed of check-in critical (<10s), streak freeze, forgiveness model, calendar heatmap for visualization."
      sources_count: 3
    problem_exploration:
      problem_statement: "Self-hosted habit tracker, mobile-first, end-of-day batch logging, 3 habit types (boolean/numeric/text), forgiving streak model, multi-user"
      constraints:
        - "Mobile-first (phone use)"
        - "React 19 + Vite 6 + Tailwind v4 + shadcn/ui in Nx"
        - "FastAPI + PostgreSQL + cookie auth"
        - "Check-in < 10s per habit"
        - "No mood tracking"
        - "Standalone v1"
      success_criteria:
        - "All habits logged in < 2 minutes"
        - "3 habit types with type-appropriate UX"
        - "Per-habit graphs with time range"
        - "Overview page"
        - "Preset library + custom habits + categories"
        - "Streak freeze + forgiveness"
        - "Flexible frequency"
        - "Browser push notifications"
        - "Multi-user scoped by user_id"
    next_phase: "Phase 3: User & Persona Exploration"
    persona_exploration:
      personas:
        - "Marcin: primary user, all 3 habit types, end-of-day batch on phone, ~90s session"
        - "Piotr: power customizer, mostly numeric habits with targets, mid-day + evening sessions"
      user_journeys:
        - "Marcin: scan grid → tap boolean done → numeric popup → text modal → check completion bar"
        - "Piotr: onboarding presets + custom creation → mid-day workout log → weekly trend review"
