task:
  title: "Habit Tracker App (habits.parda.me)"
  description: "Design and create a new habit tracker app for the cockpit-app Nx monorepo. Tech stack: React 19 + Vite 6 + Tailwind CSS v4 + shadcn/ui. Cookie-based auth. Deployment: Raspberry Pi Docker container at habits.parda.me."
  status: completed
  tags: ["greenfield", "react", "habits", "frontend"]
  priority: medium

design_context:
  design_characteristics:
    is_greenfield: true
    is_enhancement: false
    is_ui_focused: true
    is_backend: true
    is_complex: true
    is_simple: false
  complexity_level: "complex"
  collected_urls: []
  research_topics:
    - "Habit tracker UX patterns & best practices: daily check-ins, streaks, progress visualization, what makes habit trackers effective"
  user_files_list: ["daylio-screenshot.png"]
  user_notes: |
    Key design direction from user:
    - Daylio-style icon grid check-in view (loved the UI from screenshot)
    - NO mood tracking ("how are you doing" feature explicitly excluded)
    - Multiple habit types: boolean (done/not done), numeric (count/measure), text (diary)
    - Numeric/text habits show popup on log asking for value
    - All habits have graphs; graph entries are clickable to see logged data in popup
    - Graphs support time range filtering
    - Preset habit library (running, sleep early, wake early, eat healthy, etc.)
    - User can create custom habits with custom types
    - Multi-user: each user has their own set of habits (uses existing cockpit-api users table)
  next_phase: null
