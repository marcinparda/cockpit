task:
  title: "Habit Tracker App (habits.parda.me)"
  description: |
    Build a new habit tracker app in the cockpit-app Nx monorepo at apps/habits.
    React 19 + Vite 6 + Tailwind CSS v4 + shadcn/ui frontend.
    FastAPI backend service in cockpit-api/src/services/habits/.
    3 habit types: boolean (one-tap), numeric (popup with target), text diary (modal).
    Daylio-style icon grid today view, forgiving streak model (soft/hard/freeze),
    per-habit graphs, stats screen, preset library, multi-user (existing users table),
    browser push notifications, mobile-first deployment at habits.parda.me.
    Also: habits card added to cockpit Apps/Services grid.
  status: completed
  tags: ["greenfield", "react", "habits", "frontend", "backend", "fullstack"]
  priority: medium

